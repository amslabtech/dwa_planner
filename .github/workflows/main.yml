name: ci

on:
  push:
    branches:
      - ros2
  pull_request:
    branches:
      - ros2

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ros:humble-ros-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros1-distro: humble
